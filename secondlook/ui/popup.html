<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecondLook</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="../shared/sl-verdict.css">
</head>
<body>
  <header class="head">
    <div class="brand">
      <span class="logo" aria-hidden="true">SL</span>
      <div class="brand-text">
        <h1>SecondLook</h1>
        <p class="tag">Only what deserves a second look.</p>
      </div>
    </div>
    <div id="pageVerdict" class="page-verdict" aria-live="polite"></div>
  </header>

  <section id="routePanel" class="route" hidden>
    <h2>How you got here</h2>
    <ol id="routeHops" class="route-hops"></ol>
    <ul id="routeReasons" class="route-reasons"></ul>
  </section>

  <main class="modules">
    <h2>Modules</h2>
    <ul id="moduleList" class="module-list"></ul>
  </main>

  <p id="statsRow" class="stats" hidden></p>

  <footer class="foot">
    <button id="resetDefaults" class="ghost" type="button">Restore defaults</button>
    <span id="verTag" class="ver"></span>
  </footer>

  <script src="../shared/settings.js"></script>
  <script src="../engine/verdict-engine.js"></script>
  <script src="../shared/sl-verdict.js"></script>
  <script src="popup.js"></script>
</body>
</html>
