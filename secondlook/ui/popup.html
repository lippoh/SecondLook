<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecondLook</title>
  <link rel="stylesheet" href="/ui/tokens.css">
  <link rel="stylesheet" href="/ui/components.css">
  <link rel="stylesheet" href="/ui/popup.css">
</head>
<body class="sl-page sl-root">
  <main id="slp">
    <header class="slp-header">
      <div class="slp-brand">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"
                fill="none" stroke="currentColor" stroke-width="1.6"/>
          <circle cx="12" cy="12" r="3" fill="currentColor"/>
        </svg>
        <span class="slp-brand__name">SecondLook</span>
      </div>
      <label class="sl-toggle" title="Pause all modules">
        <input id="slp-global" type="checkbox" aria-label="Pause all modules">
        <span class="sl-toggle__track"></span>
      </label>
    </header>
    <div id="slp-paused" class="slp-paused" hidden>
      Paused - everything stays off until you flip this back.
    </div>
    <section id="slp-site" class="slp-site" hidden>
      <div class="slp-site__row">
        <div class="slp-site__host" id="slp-host"></div>
        <span id="slp-verdict"></span>
      </div>
      <button id="slp-safemode" class="sl-btn" type="button">
        Safe Mode this tab
      </button>
    </section>
    <div id="slp-empty" class="sl-empty" hidden>
      Nothing to look at on this page type.
    </div>
    <nav id="slp-pillars" aria-label="Modules"></nav>
    <footer class="slp-footer">
      <button id="slp-dashboard" class="sl-btn" type="button" disabled
              title="Arrives in Part 11">Dashboard</button>
      <button id="slp-options" class="sl-btn" type="button">Settings</button>
      <div class="slp-footer__privacy">Local-only. No telemetry.</div>
    </footer>
  </main>
  <script src="/shared/storage.js"></script>
  <script src="/shared/settings.js"></script>
  <script src="/shared/messaging.js"></script>
  <script src="/shared/module-registry.js"></script>
  <script src="/ui/toast.js"></script>
  <script src="/ui/verdict-card.js"></script>
  <script src="/ui/popup.js"></script>
</body>
</html>
