<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SecondLook — Settings</title>
  <style>
    /* Stub only — the real options page arrives in Part 11.
       This file exists so the manifest can declare options_ui from day one. */
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 14px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #F2F5F8; color: #18212C;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #101318; color: #E8ECF1; }
    }
    .card {
      max-width: 480px; padding: 28px 32px; border-radius: 12px;
      background: #FFFFFF; border: 1px solid #DEE4EA;
      box-shadow: 0 10px 30px rgba(23, 32, 44, .10);
    }
    @media (prefers-color-scheme: dark) {
      .card { background: #181C23; border-color: #262C36; }
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { margin: 0; color: #47535F; }
    @media (prefers-color-scheme: dark) { p { color: #ADB8C3; } }
    code {
      font: 12px ui-monospace, Menlo, Consolas, monospace;
      background: rgba(127, 127, 127, .16); padding: 1px 5px; border-radius: 4px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>SecondLook settings</h1>
    <p>The full settings page arrives in <strong>Part 11</strong>. Until then, every module
    can be toggled directly from the toolbar popup — no settings page needed.</p>
    <p style="margin-top:12px">This stub exists so the manifest can declare
    <code>options_ui</code> from day one without breaking <code>Load unpacked</code>.</p>
  </main>
</body>
</html>
